<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ponto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-ponto">
  <header class="topo">
    <div class="topo-marca">
      <span class="marca">Escala</span>
      <span class="marca-sub">Ponto</span>
    </div>
    <nav class="topo-acoes">
      <a class="topo-link" href="index.html">Escala</a>
      <a class="topo-link" href="cadastros.html">Cadastros</a>
    </nav>
  </header>

  <section class="seletor">
    <label class="campo">
      <span>Seu nome</span>
      <input type="text" id="inNome" list="listaColaboradores" autocomplete="off" spellcheck="false" placeholder="Digite seu nome">
    </label>
    <label class="campo">
      <span>Hub</span>
      <select id="selHub"></select>
    </label>
  </section>

  <main class="area">
    <div class="aviso" id="aviso" hidden></div>

    <div id="painel" hidden>
      <h1 class="ponto-data" id="pontoData"></h1>
      <div class="passos" id="passos"></div>
    </div>
  </main>

  <input type="file" id="inputFoto" accept="image/*" capture="user" hidden>
  <datalist id="listaColaboradores"></datalist>
  <div class="status" id="status" role="status" aria-live="polite"></div>

  <script type="module" src="ponto.js"></script>
</body>
</html>
