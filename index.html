<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escala de turnos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div class="topo-marca">
      <span class="marca">Escala</span>
      <span class="marca-sub">Lançamento de turnos</span>
    </div>
    <nav class="topo-acoes">
      <a class="topo-link" href="cadastros.html">Cadastros</a>
    </nav>
  </header>

  <section class="seletor">
    <label class="campo">
      <span>Supervisor</span>
      <select id="selSupervisor"></select>
    </label>
    <label class="campo">
      <span>Hub</span>
      <select id="selHub" disabled></select>
    </label>
  </section>

  <main class="area">
    <div class="aviso" id="aviso" hidden></div>

    <div id="painel" hidden>
      <div class="barra">
        <div class="nav-periodo">
          <button type="button" class="btn-icone" id="btnAnterior" aria-label="Período anterior">‹</button>
          <button type="button" class="btn-icone" id="btnProximo" aria-label="Próximo período">›</button>
          <h1 id="tituloPeriodo"></h1>
          <button type="button" class="btn-texto" id="btnHoje">Hoje</button>
        </div>
        <div class="barra-dir">
          <p class="resumo" id="resumoPeriodo"></p>
          <div class="alternador" role="group" aria-label="Visualização">
            <button type="button" data-modo="semana" aria-pressed="true">Semana</button>
            <button type="button" data-modo="mes" aria-pressed="false">Mês</button>
          </div>
        </div>
      </div>
      <div id="quadro"></div>
    </div>
  </main>

  <dialog id="dlgDia" class="dlg-dia" aria-labelledby="dlgTitulo">
    <div class="dlg-cab">
      <h2 id="dlgTitulo"></h2>
      <button type="button" class="btn-icone" id="dlgFechar" aria-label="Fechar">×</button>
    </div>
    <div class="dlg-corpo" id="dlgCorpo"></div>
  </dialog>

  <datalist id="listaColaboradores"></datalist>
  <div class="status" id="status" role="status" aria-live="polite"></div>

  <script type="module" src="escala.js"></script>
</body>
</html>
